<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drawing with CSS</title>

    <link rel="stylesheet" href="style.css">

    <!-- CSS dos desenhos -->
    <link rel="stylesheet" href="css/tortoise.css">
    <link rel="stylesheet" href="css/satellite.css">
    <link rel="stylesheet" href="css/parrot.css">
    <link rel="stylesheet" href="css/dragon.css">
    <link rel="stylesheet" href="css/icecream.css">
    <link rel="stylesheet" href="css/bouncing-ball.css">
</head>

<body>

    <header>
        <h1>Drawing with CSS</h1>
        <p>CSS Art Collection</p>
    </header>

    <main class="gallery">

        <article class="art-card art-card--tortoise">

            <div class="container">
                <div class="leg leg-3"></div>
                <div class="leg leg-4"></div>

                <div class="shell">
                    <div class="neck"></div>
                    <div class="belt"></div>
                    <div class="eye"></div>
                </div>

                <div class="leg leg-1"></div>
                <div class="leg leg-2"></div>
            </div>

            <h2>Tortoise</h2>

        </article>
<article class="art-card art-card--satellite">
    <div class="satellite-stage">
        <div class="satellite-container">
            <div class="planet"></div>
            <div class="satellite"></div>
        </div>
    </div>

    <h2>Satellite</h2>
</article>
<article class="art-card art-card--parrot">

    <div class="parrot-wrapper">

        <div class="parrot-canvas">
            <div class="parrot">
                <div class="wing">
                    <div class="color-wing"></div>
                </div>

                <div class="eye"></div>
                <div class="beak"></div>
                <div class="feather"></div>
                <div class="leg"></div>
                <div class="branch"></div>
            </div>
        </div>

    </div>

    <h2>Parrot</h2>
</article>
<article class="art-card art-card--dragon">

    <div class="dragon-stage">
        <div class="dragon-container">

            <div class="face">
                <div class="eye"></div>
                <div class="nostril"></div>
                <div class="ear"></div>
                <div class="horn horn-l"></div>
                <div class="horn horn-r"></div>
            </div>

            <div class="body">
                <div class="stomach"></div>
            </div>

            <div class="wing wing-l"></div>
            <div class="wing wing-r"></div>

            <div class="arm arm-l"></div>
            <div class="arm arm-r"></div>

            <div class="forearm forearm-l"></div>
            <div class="forearm forearm-r"></div>

            <div class="leg leg-l"></div>
            <div class="leg leg-r"></div>

            <div class="shadow"></div>

        </div>
    </div>

    <h2>Dragon</h2>

</article>
<article class="art-card art-card--icecream">

    <div class="icecream-stage">
        <div class="icecream-container">

            <div class="icecream">
                <div class="head">
                    <div class="bite"></div>
                    <div class="bite"></div>

                    <div class="stripContainer">
                        <div class="strip"></div>
                        <div class="strip"></div>
                    </div>

                    <div class="mltContainer">
                        <div class="drip"></div>
                        <div class="drip"></div>
                        <div class="drip"></div>
                        <div class="drip"></div>
                    </div>
                </div>

                <div class="stick"></div>
                <div class="icecream-shadow"></div>
                <div class="puddle"></div>
            </div>

        </div>
    </div>

    <h2>Ice Cream</h2>
</article>
<article class="art-card art-card--bouncing-ball">

    <div class="bouncing-stage">

        <div class="bouncing-canvas">

            <div class="ball-container">
                <div class="ball"></div>
            </div>

            <div class="shadow"></div>

        </div>

    </div>

    <h2>Bouncing Ball</h2>

</article>

    </main>

</body>
</html>
